name: Build RPi5 release tarball

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

env:
  RPI5_OVERLAY_TAG: rpi5-sbc-overlay-current
  RPI5_OVERLAY_ASSET: rpi5-sbc-overlay.tar.gz

jobs:
  rpi5-release:
    name: Build and release RPi5 tarball
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download RPi5 SBC overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p sbc-overlay-download sbc-overlay
          gh release download "$RPI5_OVERLAY_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$RPI5_OVERLAY_ASSET" \
            --dir sbc-overlay-download
          test -s "sbc-overlay-download/$RPI5_OVERLAY_ASSET"
          tar -xzf "sbc-overlay-download/$RPI5_OVERLAY_ASSET" -C sbc-overlay

      - name: Build RPi5 tarball
        run: |
          set -euo pipefail
          SBC_OVERLAY_DIR="$PWD/sbc-overlay" bash MANET/packaging/build-rpi5-tarball.sh rpi5-install.tar.gz

      - name: Verify tarball
        run: |
          set -euo pipefail
          tar -tzf rpi5-install.tar.gz | sed -n '1,40p'
          tar --numeric-owner -tvzf rpi5-install.tar.gz \
            ./lib \
            ./etc/systemd/system/multi-user.target.wants/manet-txpower.service \
            ./usr/local/bin/radio-setup.sh \
            ./usr/local/bin/mesh-status.py \
            ./usr/local/bin/perf-dashboard.py \
            ./usr/lib/modules/6.6.78-manet+/extra/morse/dot11ah.ko \
            ./usr/lib/modules/6.6.78-manet+/extra/morse/morse.ko
          tar -tzf rpi5-install.tar.gz | grep -F './usr/lib/firmware/morse/bcf_'
          tar -xOzf rpi5-install.tar.gz ./usr/local/bin/radio-setup.sh | grep -F '/home/radio/.local/state/syncthing'
          tar -xOzf rpi5-install.tar.gz ./usr/local/bin/mesh-ip-manager.sh | grep -F 'address=/mumble.local/'
          tar -xOzf rpi5-install.tar.gz ./usr/local/bin/mesh-ip-manager.sh | grep -F 'address=/mtx.local/'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpi5-install-${{ github.sha }}
          path: rpi5-install.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref_slug="$(printf '%s' "$REF_NAME" | sed 's#[/_]#-#g' | tr -cd 'A-Za-z0-9.-')"
          tag="rpi5-${ref_slug}-${GITHUB_SHA::12}"
          title="RPi5 install tarball ${REF_NAME} ${GITHUB_SHA::7}"
          notes="Automated RPi5 install tarball built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}."
          gh release create "$tag" rpi5-install.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "$notes"
