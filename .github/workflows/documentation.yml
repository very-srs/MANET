name: Documentation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '**/README.md'
      - 'CONTRIBUTING.md'
      - 'MANET/packaging/**'
      - 'kernel/build/**'
      - 'MANET/node_tools/**'
      - 'MANET/share/manet/fer-logo-black.png'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '**/README.md'
      - 'CONTRIBUTING.md'
      - 'MANET/packaging/**'
      - 'kernel/build/**'
      - 'MANET/node_tools/**'
      - 'MANET/share/manet/fer-logo-black.png'
      - '.github/workflows/documentation.yml'

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Markdown renderer
        run: |
          python3 -m venv /tmp/manet-docs-venv
          /tmp/manet-docs-venv/bin/python -m pip install -r docs/guide/requirements.txt
      - name: Build and check documentation
        run: |
          /tmp/manet-docs-venv/bin/python -m unittest discover -s docs/guide
          /tmp/manet-docs-venv/bin/python docs/guide/build.py
      - name: Check contributor build tools
        run: |
          python3 -m unittest discover -s kernel/build
          for script in MANET/packaging/*.sh kernel/build/*.sh; do
            bash -n "$script"
          done
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/guide/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
