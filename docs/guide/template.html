<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <title>$title · MANET field guide</title>
  <link rel="stylesheet" href="$stylesheet">
  <script src="$script" defer></script>
</head>
<body data-page-kind="$page_kind">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="masthead">
    <a class="brand" data-topic href="$home"><img class="brand-logo" src="$logo" alt="FER" width="441" height="512"><span>MANET<small>FIELD GUIDE</small></span></a>
    <a class="repository-link" href="$repository">Source on GitHub <span aria-hidden="true">↗</span></a>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <button class="contents-toggle" type="button" hidden
        aria-expanded="false" aria-controls="guide-topics">Browse chapters</button>
      <nav id="guide-topics" aria-label="Guide topics"><ul>$nav</ul></nav>
    </aside>
    <main id="main" tabindex="-1">
      $reading_controls
      <div class="page-heading"><h1>$title</h1><p>$description</p></div>
      <noscript><p class="notice">JavaScript is off. All three reading levels appear below, in order: Marine, User, Developer.</p></noscript>
      <div id="reading-content">$body</div>
      $next_link
      <footer><a href="$source">$source_label <span aria-hidden="true">↗</span></a></footer>
    </main>
  </div>
  <p class="sr-only" id="tier-announcement" role="status" aria-live="polite"></p>
</body>
</html>
