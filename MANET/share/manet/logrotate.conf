# Explicit MANET paths only. Application logs belong to their operators.
# Open shell/tee descriptors require copytruncate; a few diagnostic lines can
# be lost during that copy. Size is checked periodically, not a hard quota.
/var/log/mesh-config-apply.log
/var/log/mesh-config-sync.log
/var/log/mesh-radio-state.log
/var/log/ethernet-detect.log
/var/log/usb-ethernet-watch.log
/var/log/radio-setup.log
/var/log/mesh-provision.log
/var/log/manet-user-scripts.log
/var/log/manet-voice-setup.log
{
    size 5M
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
}
