[Journal]
# Persistent journal, so that a node which resets can be asked afterwards why.
#
# This has to sort after 40-. Raspberry Pi OS ships
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf with
# Storage=volatile to spare the SD card, drop-ins are applied in filename
# order, and the last assignment wins. That single line is why provisioning's
# old approach — chown/chmod on /var/log/journal — could never work: no
# permissions on the directory matter while storage is explicitly volatile,
# and the journal stayed in /run where every reset erased its own evidence.
Storage=persistent

# The default sync interval is 5 minutes. On an abrupt reset — brownout,
# hardware watchdog, hard power cut — anything not yet synced is lost, and that
# is exactly the window that would explain the reset. 10s trades a little card
# wear for retaining the last seconds before the node went down.
SyncIntervalSec=10s

# Bounded so the journal can never fill the card.
SystemMaxUse=200M
SystemMaxFileSize=25M
SystemMaxFiles=20
