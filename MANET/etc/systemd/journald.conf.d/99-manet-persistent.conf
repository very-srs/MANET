[Journal]
# Keep logs across resets. This filename must sort after Raspberry Pi OS's
# 40-rpi-volatile-storage.conf, which sets Storage=volatile. Changing the
# permissions on /var/log/journal alone does not override that setting.
Storage=persistent

# Sync every 10 seconds rather than the default 5 minutes to retain more of
# the log before a brownout, watchdog reset or power cut, at some cost in writes.
SyncIntervalSec=10s

# Bounded so the journal can never fill the card.
SystemMaxUse=200M
SystemMaxFileSize=25M
SystemMaxFiles=20
