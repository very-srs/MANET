[Unit]
Wants=wifi-rfkill-unblock.service
After=wifi-rfkill-unblock.service

[Service]
# ExecStartPre runs on every real start/restart, even if a previous oneshot
# preparation unit is still active from before the radio was used for mesh.
ExecStartPre=/usr/local/bin/prepare-ap-iface.sh
ExecStartPost=/usr/local/bin/manet_ap_mesh.py ap-power-post-start
# Every AP start requests DHCP immediately, including boot and recovery. The
# DHCP unit checks its forwarding port and isolation before serving clients.
# Queue without waiting; DHCP failure must not tear down a working hotspot.
ExecStartPost=-/bin/systemctl start --no-block dnsmasq.service
# Bound the systemd job itself. Timing out only a systemctl client leaves its
# start queued, able to reclaim the radio after Ethernet policy has changed.
TimeoutStartSec=45
TimeoutStopSec=20
