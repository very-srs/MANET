[Service]
# Management still needs root for config edits and systemd control.
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
LockPersonality=yes
RestrictRealtime=yes
SystemCallArchitectures=native
# Atomic config writes require /etc; measurements live under /var/log.
ReadWritePaths=/etc /run /var/lib
LogsDirectory=manet-measurements
ReadWritePaths=/var/log/manet-measurements
AmbientCapabilities=
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_NET_ADMIN CAP_NET_RAW
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
# The power-status helper reads the Raspberry Pi mailbox.
DevicePolicy=closed
DeviceAllow=/dev/vcio rw
DeviceAllow=/dev/vchiq rw
