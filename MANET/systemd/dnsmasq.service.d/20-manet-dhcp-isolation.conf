[Unit]
Requires=manet-dhcp-isolation.service
After=manet-dhcp-isolation.service

[Service]
# A routed uplink or the bat0-only bridge is not an EUD attachment.
ExecCondition=/usr/local/bin/manet-dhcp-isolation.py eud-ready
# Also detect a missing/changed table when dnsmasq restarts after boot.
ExecStartPre=/usr/local/bin/manet-dhcp-isolation.py ensure
